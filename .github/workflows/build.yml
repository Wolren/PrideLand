# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          17,    # Current Java LTS & minimum supported by Minecraft
          21,    # Current Java LTS
        ]
        # and run on both Linux and Windows
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build (root modules)
        run: ./gradlew :fabric:build :forge:build :quilt:build
      - name: build (multi-version)
        run: ./gradlew :mc-versions:1.20.4:fabric:build :mc-versions:1.20.4:forge:build :mc-versions:1.20.4:quilt:build :mc-versions:1.21.1:fabric:build :mc-versions:1.21.1:forge:build :mc-versions:1.21.1:quilt:build :mc-versions:1.21.11:fabric:build :mc-versions:1.21.11:forge:build :mc-versions:1.21.11:quilt:build
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v3
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            forge/build/libs/
            quilt/build/libs/
            mc-versions/*/fabric/build/libs/
            mc-versions/*/forge/build/libs/
            mc-versions/*/quilt/build/libs/