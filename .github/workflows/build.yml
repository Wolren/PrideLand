# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        # Loom 1.17 requires JVM 21+ at configure time, so 17 is not usable.
        java: [21]
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: seed cloth-config mavenLocal (plain-jar remap input)
        shell: bash
        run: bash scripts/seed-cloth-mavenlocal.sh
      # -Dorg.gradle.java.home overrides the machine-specific org.gradle.java.home
      # in root gradle.properties (a Windows path) so CI always uses the job JVM.
      - name: build (root modules, MC 1.20.1)
        shell: bash
        run: ./gradlew :common:build :fabric:build :forge:build :quilt:build -Dorg.gradle.java.home="$JAVA_HOME"
      - name: build (multi-version)
        shell: bash
        run: |
          ./gradlew \
            :mc-versions:1.20.x:1.20.2:common:build \
            :mc-versions:1.20.x:1.20.2:fabric:build \
            :mc-versions:1.20.x:1.20.2:forge:build \
            :mc-versions:1.20.x:1.20.3:common:build \
            :mc-versions:1.20.x:1.20.3:fabric:build \
            :mc-versions:1.20.x:1.20.4:common:build \
            :mc-versions:1.20.x:1.20.4:fabric:build \
            :mc-versions:1.20.x:1.20.4:forge:build \
            :mc-versions:1.20.x:1.20.4:quilt:build \
            :mc-versions:1.21.1:common:build \
            :mc-versions:1.21.1:fabric:build \
            :mc-versions:1.21.1:neoforge:build \
            :mc-versions:1.21.1:quilt:build \
            :mc-versions:1.21.11:common:build \
            :mc-versions:1.21.11:fabric:build \
            :mc-versions:1.21.11:forge:build \
            :mc-versions:1.21.11:quilt:build \
            :mc-versions:1.21.x:1.21.2:common:build \
            :mc-versions:1.21.x:1.21.2:fabric:build \
            :mc-versions:1.21.x:1.21.2:neoforge:build \
            :mc-versions:1.21.x:1.21.2:quilt:build \
            :mc-versions:1.21.x:1.21.3:common:build \
            :mc-versions:1.21.x:1.21.3:fabric:build \
            :mc-versions:1.21.x:1.21.3:neoforge:build \
            :mc-versions:1.21.x:1.21.3:quilt:build \
            :mc-versions:1.21.x:1.21.4:common:build \
            :mc-versions:1.21.x:1.21.4:fabric:build \
            :mc-versions:1.21.x:1.21.4:neoforge:build \
            :mc-versions:1.21.x:1.21.4:quilt:build \
            :mc-versions:1.21.x:1.21.5:common:build \
            :mc-versions:1.21.x:1.21.5:fabric:build \
            :mc-versions:1.21.x:1.21.5:neoforge:build \
            :mc-versions:1.21.x:1.21.5:quilt:build \
            :mc-versions:1.21.x:1.21.6:common:build \
            :mc-versions:1.21.x:1.21.6:fabric:build \
            :mc-versions:1.21.x:1.21.6:neoforge:build \
            :mc-versions:1.21.x:1.21.6:quilt:build \
            :mc-versions:1.21.x:1.21.7:common:build \
            :mc-versions:1.21.x:1.21.7:fabric:build \
            :mc-versions:1.21.x:1.21.7:neoforge:build \
            :mc-versions:1.21.x:1.21.7:quilt:build \
            :mc-versions:1.21.x:1.21.8:common:build \
            :mc-versions:1.21.x:1.21.8:fabric:build \
            :mc-versions:1.21.x:1.21.8:neoforge:build \
            :mc-versions:1.21.x:1.21.8:quilt:build \
            :mc-versions:1.21.x:1.21.9:common:build \
            :mc-versions:1.21.x:1.21.9:fabric:build \
            :mc-versions:1.21.x:1.21.9:neoforge:build \
            :mc-versions:1.21.x:1.21.9:quilt:build \
            :mc-versions:1.21.x:1.21.10:common:build \
            :mc-versions:1.21.x:1.21.10:fabric:build \
            :mc-versions:1.21.x:1.21.10:neoforge:build \
            :mc-versions:1.21.x:1.21.10:quilt:build \
            -Dorg.gradle.java.home="$JAVA_HOME"
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }} # Only upload artifacts built from latest java on one OS
        uses: actions/upload-artifact@v3
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            forge/build/libs/
            quilt/build/libs/
            mc-versions/**/fabric/build/libs/
            mc-versions/**/forge/build/libs/
            mc-versions/**/quilt/build/libs/
            mc-versions/**/neoforge/build/libs/

  # MC 26.2 requires Java 25 (Mojang ships 25 with 26.1+); these are standalone
  # Gradle builds with their own wrappers, kept outside the root build.
  build-26x:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrappers executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x mc-versions/1.26.x/gradlew mc-versions/1.26.x-fabric/gradlew
      - name: build (26.2 NeoForge)
        shell: bash
        working-directory: mc-versions/1.26.x
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"
      # 26.1 is supported via -P property overrides (verified API-identical to 26.2;
      # only versions + pack format differ). Keep the pair in sync with gradle.properties.
      # Fabric 26.1 is NOT built: the fabric-api aggregate for 26.1 is unpublished
      # (metadata-only phantom versions, poms 404) - would need direct module deps.
      - name: build (26.1 NeoForge)
        shell: bash
        working-directory: mc-versions/1.26.x
        run: ./gradlew build -Pminecraft_version=26.1 -Pminecraft_version_range=[26.1] -Pneo_version=26.1.0.19-beta -Pmc_version=26.1 -Pjei_version=29.2.0.21 -Pmod_version=1.0.4-26.1 -Ppack_format=101 -Dorg.gradle.java.home="$JAVA_HOME"
      - name: build (26.2 Fabric)
        shell: bash
        working-directory: mc-versions/1.26.x-fabric
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"
