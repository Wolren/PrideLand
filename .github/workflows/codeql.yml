name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Seed cloth-config mavenLocal (plain-jar remap input)
        shell: bash
        run: bash scripts/seed-cloth-mavenlocal.sh
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Build with Gradle
        shell: bash
        run: |
          for i in 1 2 3; do
            if ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"; then
              exit 0
            fi
            bash scripts/remap-fixup.sh
          done
          exit 1
        env:
          CODEQL_ACTION_BUILD_MODE: manual
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4