name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Seed cloth-config mavenLocal (plain-jar remap input)
        shell: bash
        run: bash scripts/seed-cloth-mavenlocal.sh
      - name: Build with Gradle
        shell: bash
        run: |
          for i in 1 2 3; do
            if ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"; then
              exit 0
            fi
            bash scripts/remap-fixup.sh
          done
          exit 1
