name: CI

on:
  push:
    branches: [main_1.20.1]
  pull_request:
    branches: [main_1.20.1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Seed cloth-config mavenLocal (plain-jar remap input)
        shell: bash
        run: bash scripts/seed-cloth-mavenlocal.sh
      - name: Build with Gradle
        shell: bash
        run: ./gradlew build --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
