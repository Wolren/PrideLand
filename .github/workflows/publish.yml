# Publish all fleet jars to GitHub releases; Modrinth/CurseForge upload only when `upload-platforms=upload`.

name: publish
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: false
        default: 'release'
        type: choice
        options: ['release', 'beta', 'alpha']
      upload-platforms:
        description: 'Upload to Modrinth + CurseForge'
        required: false
        default: 'skip'
        type: choice
        options: ['skip', 'upload']
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: seed cloth-config mavenLocal (plain-jar remap input)
        shell: bash
        run: bash scripts/seed-cloth-mavenlocal.sh
      - name: build all modules
        shell: bash
        run: |
          for i in 1 2 3; do
            if ./gradlew \
            :common:build :fabric:build :forge:build :quilt:build \
            :mc-versions:1.20.x:1.20.2:common:build \
            :mc-versions:1.20.x:1.20.2:fabric:build \
            :mc-versions:1.20.x:1.20.2:forge:build \
            :mc-versions:1.20.x:1.20.3:common:build \
            :mc-versions:1.20.x:1.20.3:fabric:build \
            :mc-versions:1.20.x:1.20.4:common:build \
            :mc-versions:1.20.x:1.20.4:fabric:build \
            :mc-versions:1.20.x:1.20.4:forge:build \
            :mc-versions:1.20.x:1.20.4:quilt:build \
            :mc-versions:1.21.1:common:build \
            :mc-versions:1.21.1:fabric:build \
            :mc-versions:1.21.1:neoforge:build \
            :mc-versions:1.21.1:quilt:build \
            :mc-versions:1.21.11:common:build \
            :mc-versions:1.21.11:fabric:build \
            :mc-versions:1.21.11:forge:build \
            :mc-versions:1.21.11:quilt:build \
            :mc-versions:1.21.x:1.21.2:common:build \
            :mc-versions:1.21.x:1.21.2:fabric:build \
            :mc-versions:1.21.x:1.21.2:neoforge:build \
            :mc-versions:1.21.x:1.21.2:quilt:build \
            :mc-versions:1.21.x:1.21.3:common:build \
            :mc-versions:1.21.x:1.21.3:fabric:build \
            :mc-versions:1.21.x:1.21.3:neoforge:build \
            :mc-versions:1.21.x:1.21.3:quilt:build \
            :mc-versions:1.21.x:1.21.4:common:build \
            :mc-versions:1.21.x:1.21.4:fabric:build \
            :mc-versions:1.21.x:1.21.4:neoforge:build \
            :mc-versions:1.21.x:1.21.4:quilt:build \
            :mc-versions:1.21.x:1.21.5:common:build \
            :mc-versions:1.21.x:1.21.5:fabric:build \
            :mc-versions:1.21.x:1.21.5:neoforge:build \
            :mc-versions:1.21.x:1.21.5:quilt:build \
            :mc-versions:1.21.x:1.21.6:common:build \
            :mc-versions:1.21.x:1.21.6:fabric:build \
            :mc-versions:1.21.x:1.21.6:neoforge:build \
            :mc-versions:1.21.x:1.21.6:quilt:build \
            :mc-versions:1.21.x:1.21.7:common:build \
            :mc-versions:1.21.x:1.21.7:fabric:build \
            :mc-versions:1.21.x:1.21.7:neoforge:build \
            :mc-versions:1.21.x:1.21.7:quilt:build \
            :mc-versions:1.21.x:1.21.8:common:build \
            :mc-versions:1.21.x:1.21.8:fabric:build \
            :mc-versions:1.21.x:1.21.8:neoforge:build \
            :mc-versions:1.21.x:1.21.8:quilt:build \
            :mc-versions:1.21.x:1.21.9:common:build \
            :mc-versions:1.21.x:1.21.9:fabric:build \
            :mc-versions:1.21.x:1.21.9:neoforge:build \
            :mc-versions:1.21.x:1.21.9:quilt:build \
            :mc-versions:1.21.x:1.21.10:common:build \
            :mc-versions:1.21.x:1.21.10:fabric:build \
            :mc-versions:1.21.x:1.21.10:neoforge:build \
            :mc-versions:1.21.x:1.21.10:quilt:build \
            -Dorg.gradle.java.home="$JAVA_HOME"; then
              exit 0
            fi
            bash scripts/remap-fixup.sh
          done
          exit 1
      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-21
          if-no-files-found: error
          path: |
            fabric/build/libs/pride_land-*.jar
            forge/build/libs/pride_land-*.jar
            quilt/build/libs/pride_land-*.jar
            mc-versions/**/build/libs/pride_land-*.jar

  build-26x:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrappers executable
        run: chmod +x mc-versions/1.26.x/gradlew mc-versions/1.26.x-fabric/gradlew
      - name: build 26.2 NeoForge
        shell: bash
        working-directory: mc-versions/1.26.x
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"
      - name: build 26.2 Fabric
        shell: bash
        working-directory: mc-versions/1.26.x-fabric
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"
      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-26x
          if-no-files-found: error
          path: |
            mc-versions/1.26.x/build/libs/pride_land-*.jar
            mc-versions/1.26.x-fabric/build/libs/pride_land-*.jar

  create-release:
    # The previous per-row "ensure release exists" step raced across 43 parallel matrix rows and GitHub's API let several win simultaneously
    needs: [build, build-26x]
    runs-on: ubuntu-22.04
    steps:
      - name: create release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists - skipping"
          else
            gh release create --repo "${GITHUB_REPOSITORY}" "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi

  publish:
    needs: [create-release]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.20.1 (root modules)
          - { version: "1.20.1", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: fabric/build/libs/pride_land-1.1.3-1.20.1.jar }
          - { version: "1.20.1", modver: "1.1.3", loader: forge,    prefix: jars-21, java: "21", jar: forge/build/libs/pride_land-1.1.3-1.20.1.jar }
          - { version: "1.20.1", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: quilt/build/libs/pride_land-1.1.3-1.20.1.jar }
          # 1.20.2
          - { version: "1.20.2", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.2/fabric/build/libs/pride_land-1.1.3-1.20.2.jar }
          - { version: "1.20.2", modver: "1.1.3", loader: forge,    prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.2/forge/build/libs/pride_land-1.1.3-1.20.2.jar }
          # 1.20.3 (Forge line abandoned upstream)
          - { version: "1.20.3", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.3/fabric/build/libs/pride_land-1.1.3-1.20.3.jar }
          # 1.20.4
          - { version: "1.20.4", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.4/fabric/build/libs/pride_land-1.1.3-1.20.4.jar }
          - { version: "1.20.4", modver: "1.1.3", loader: forge,    prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.4/forge/build/libs/pride_land-1.1.3-1.20.4.jar }
          - { version: "1.20.4", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.4/quilt/build/libs/pride_land-1.1.3-1.20.4.jar }
          # 1.21.1
          - { version: "1.21.1", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.1/fabric/build/libs/pride_land-1.1.3-1.21.1.jar }
          - { version: "1.21.1", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.1/neoforge/build/libs/pride_land-1.1.3-1.21.1.jar }
          - { version: "1.21.1", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.1/quilt/build/libs/pride_land-1.1.3-1.21.1.jar }
          # 1.21.2 to 1.21.10
          - { version: "1.21.2", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.2/fabric/build/libs/pride_land-1.1.3-1.21.2.jar }
          - { version: "1.21.2", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.2/neoforge/build/libs/pride_land-1.1.3-1.21.2.jar }
          - { version: "1.21.2", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.2/quilt/build/libs/pride_land-1.1.3-1.21.2.jar }
          - { version: "1.21.3", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.3/fabric/build/libs/pride_land-1.1.3-1.21.3.jar }
          - { version: "1.21.3", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.3/neoforge/build/libs/pride_land-1.1.3-1.21.3.jar }
          - { version: "1.21.3", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.3/quilt/build/libs/pride_land-1.1.3-1.21.3.jar }
          - { version: "1.21.4", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.4/fabric/build/libs/pride_land-1.1.3-1.21.4.jar }
          - { version: "1.21.4", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.4/neoforge/build/libs/pride_land-1.1.3-1.21.4.jar }
          - { version: "1.21.4", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.4/quilt/build/libs/pride_land-1.1.3-1.21.4.jar }
          - { version: "1.21.5", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.5/fabric/build/libs/pride_land-1.1.3-1.21.5.jar }
          - { version: "1.21.5", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.5/neoforge/build/libs/pride_land-1.1.3-1.21.5.jar }
          - { version: "1.21.5", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.5/quilt/build/libs/pride_land-1.1.3-1.21.5.jar }
          - { version: "1.21.6", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.6/fabric/build/libs/pride_land-1.1.3-1.21.6.jar }
          - { version: "1.21.6", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.6/neoforge/build/libs/pride_land-1.1.3-1.21.6.jar }
          - { version: "1.21.6", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.6/quilt/build/libs/pride_land-1.1.3-1.21.6.jar }
          - { version: "1.21.7", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.7/fabric/build/libs/pride_land-1.1.3-1.21.7.jar }
          - { version: "1.21.7", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.7/neoforge/build/libs/pride_land-1.1.3-1.21.7.jar }
          - { version: "1.21.7", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.7/quilt/build/libs/pride_land-1.1.3-1.21.7.jar }
          - { version: "1.21.8", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.8/fabric/build/libs/pride_land-1.1.3-1.21.8.jar }
          - { version: "1.21.8", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.8/neoforge/build/libs/pride_land-1.1.3-1.21.8.jar }
          - { version: "1.21.8", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.8/quilt/build/libs/pride_land-1.1.3-1.21.8.jar }
          - { version: "1.21.9", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.9/fabric/build/libs/pride_land-1.1.3-1.21.9.jar }
          - { version: "1.21.9", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.9/neoforge/build/libs/pride_land-1.1.3-1.21.9.jar }
          - { version: "1.21.9", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.9/quilt/build/libs/pride_land-1.1.3-1.21.9.jar }
          - { version: "1.21.10", modver: "1.1.3", loader: fabric,  prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.10/fabric/build/libs/pride_land-1.1.3-1.21.10.jar }
          - { version: "1.21.10", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.10/neoforge/build/libs/pride_land-1.1.3-1.21.10.jar }
          - { version: "1.21.10", modver: "1.1.3", loader: quilt,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.10/quilt/build/libs/pride_land-1.1.3-1.21.10.jar }
          # 1.21.11 (NeoForge module lives in the forge/ dir)
          - { version: "1.21.11", modver: "1.1.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.11/fabric/build/libs/pride_land-1.1.3-1.21.11.jar }
          - { version: "1.21.11", modver: "1.1.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.11/forge/build/libs/pride_land-1.1.3-1.21.11.jar }
          - { version: "1.21.11", modver: "1.1.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.11/quilt/build/libs/pride_land-1.1.3-1.21.11.jar }
          # 26.2 (standalone builds, Java 25): artifact-relative paths: upload-artifact strips the common mc-versions/ parent from jars-26x, so no prefix here.
          - { version: "26.2", modver: "1.1.3", loader: neoforge, prefix: jars-26x, java: "25", jar: 1.26.x/build/libs/pride_land-1.1.3-26.2.jar }
          - { version: "26.2", modver: "1.1.3", loader: fabric,   prefix: jars-26x, java: "25", jar: 1.26.x-fabric/build/libs/pride_land-1.1.3-26.2.jar }
    steps:
      - name: download jars
        uses: actions/download-artifact@v4
        with:
          pattern: 'jars-*'
          path: .

      # Rename to a unique file name per row: 1.20.2's fabric+forge jars share the "pride_land-1.1.3-1.20.2.jar" name
      - name: stage unique file
        shell: bash
        run: |
          mkdir -p /tmp/publish
          cp "${{ matrix.prefix }}/${{ matrix.jar }}" \
             "/tmp/publish/pride_land-${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}.jar"

      # Fail-open: any query error lets the publish proceed; the platforms reject duplicate versions server-side.
      - name: check existing versions
        id: check
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          version_name="${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}"
          file_name="pride_land-${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}.jar"

          modrinth_exists=false
          if [ -n "${{ vars.MODRINTH_PROJECT_ID }}" ]; then
            if curl -fsS "https://api.modrinth.com/v2/project/${{ vars.MODRINTH_PROJECT_ID }}/version" \
                | jq -e --arg v "$version_name" 'any(.[]; .version_number == $v)' >/dev/null 2>&1; then
              modrinth_exists=true
            fi
          fi
          echo "modrinth-exists=$modrinth_exists" >> "$GITHUB_OUTPUT"

          curseforge_exists=false
          if [ -n "${{ vars.CURSEFORGE_PROJECT_ID }}" ]; then
            if curl -fsS -H "x-api-key: ${CF_TOKEN}" \
                "https://api.curseforge.com/v1/mods/${{ vars.CURSEFORGE_PROJECT_ID }}/versions" \
                | jq -e --arg v "$version_name" --arg f "$file_name" \
                    'any(.data[]; .displayName == $v or .fileName == $f)' >/dev/null 2>&1; then
              curseforge_exists=true
            fi
          fi
          echo "curseforge-exists=$curseforge_exists" >> "$GITHUB_OUTPUT"

          gh_asset_exists=false
          asset_name="pride_land-${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}.jar"
          if [ -n "${{ github.ref_name }}" ] && gh release view "${{ github.ref_name }}" \
              --json assets --jq "[.assets[].name] | any(. == \"$asset_name\")" >/dev/null 2>&1; then
            gh_asset_exists=true
          fi
          echo "gh-asset-exists=$gh_asset_exists" >> "$GITHUB_OUTPUT"

      - name: publish to GitHub release (assets only)
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outputs.gh-asset-exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload --repo "${GITHUB_REPOSITORY}" "${{ github.ref_name }}" \
            /tmp/publish/pride_land-${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}.jar --clobber

      - name: publish to Modrinth + CurseForge
        if: inputs.upload-platforms == 'upload' && (steps.check.outputs.modrinth-exists != 'true' || steps.check.outputs.curseforge-exists != 'true')
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: /tmp/publish/pride_land-${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}.jar
          version: ${{ matrix.modver }}-${{ matrix.version }}-${{ matrix.loader }}
          version-type: ${{ inputs.release-type || 'release' }}
          game-versions: ${{ matrix.version }}
          loaders: ${{ matrix.loader }}
          java: ${{ matrix.java }}
          # 26.x neoforge needs none of these: neoforge + minecraft are implicit.
          modrinth-dependencies: ${{ (startsWith(matrix.version, '26') && matrix.loader == 'neoforge') && 'none' || 'cloth-config|required,modmenu|optional,architectury-api|required' }}
          curseforge-dependencies: ${{ (startsWith(matrix.version, '26') && matrix.loader == 'neoforge') && 'none' || 'cloth-config|required,modmenu|optional,architectury-api|required' }}
          fail-mode: warn
          changelog: "PrideLand ${{ github.ref_name || 'manual' }} for Minecraft ${{ matrix.version }} (${{ matrix.loader }})"

      - name: already published on both platforms
        if: steps.check.outputs.modrinth-exists == 'true' && steps.check.outputs.curseforge-exists == 'true'
        run: echo "::notice::1.1-${{ matrix.version }}-${{ matrix.loader }} already exists on Modrinth and CurseForge - skipping"
