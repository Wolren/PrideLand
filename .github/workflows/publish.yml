# Publish all version/loader jars to Modrinth + CurseForge.
#
# Trigger: manual (workflow_dispatch) or a v* tag push.
# Project IDs come from repository variables (MODRINTH_PROJECT_ID, CURSEFORGE_PROJECT_ID);
# tokens from repository secrets (MODRINTH_TOKEN, CURSEFORGE_TOKEN - both with CREATE_VERSION scope).
#
# Matrix: every shipped loader jar across all 16 supported MC versions
# (1.20.1 root modules + 1.20.2/1.20.3/1.20.4 + 1.21.1 + 1.21.2-1.21.10 + 1.21.11 + 26.2).
# Version names are unique per platform: <mod_version>-<mc_version>-<loader>.

name: publish
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: false
        default: 'release'
        type: choice
        options: ['release', 'beta', 'alpha']
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: build all modules
        shell: bash
        run: |
          ./gradlew \
            :common:build :fabric:build :forge:build :quilt:build \
            :mc-versions:1.20.x:1.20.2:common:build \
            :mc-versions:1.20.x:1.20.2:fabric:build \
            :mc-versions:1.20.x:1.20.2:forge:build \
            :mc-versions:1.20.x:1.20.3:common:build \
            :mc-versions:1.20.x:1.20.3:fabric:build \
            :mc-versions:1.20.x:1.20.4:common:build \
            :mc-versions:1.20.x:1.20.4:fabric:build \
            :mc-versions:1.20.x:1.20.4:forge:build \
            :mc-versions:1.20.x:1.20.4:quilt:build \
            :mc-versions:1.21.1:common:build \
            :mc-versions:1.21.1:fabric:build \
            :mc-versions:1.21.1:neoforge:build \
            :mc-versions:1.21.1:quilt:build \
            :mc-versions:1.21.11:common:build \
            :mc-versions:1.21.11:fabric:build \
            :mc-versions:1.21.11:forge:build \
            :mc-versions:1.21.11:quilt:build \
            :mc-versions:1.21.x:1.21.2:common:build \
            :mc-versions:1.21.x:1.21.2:fabric:build \
            :mc-versions:1.21.x:1.21.2:neoforge:build \
            :mc-versions:1.21.x:1.21.2:quilt:build \
            :mc-versions:1.21.x:1.21.3:common:build \
            :mc-versions:1.21.x:1.21.3:fabric:build \
            :mc-versions:1.21.x:1.21.3:neoforge:build \
            :mc-versions:1.21.x:1.21.3:quilt:build \
            :mc-versions:1.21.x:1.21.4:common:build \
            :mc-versions:1.21.x:1.21.4:fabric:build \
            :mc-versions:1.21.x:1.21.4:neoforge:build \
            :mc-versions:1.21.x:1.21.4:quilt:build \
            :mc-versions:1.21.x:1.21.5:common:build \
            :mc-versions:1.21.x:1.21.5:fabric:build \
            :mc-versions:1.21.x:1.21.5:neoforge:build \
            :mc-versions:1.21.x:1.21.5:quilt:build \
            :mc-versions:1.21.x:1.21.6:common:build \
            :mc-versions:1.21.x:1.21.6:fabric:build \
            :mc-versions:1.21.x:1.21.6:neoforge:build \
            :mc-versions:1.21.x:1.21.6:quilt:build \
            :mc-versions:1.21.x:1.21.7:common:build \
            :mc-versions:1.21.x:1.21.7:fabric:build \
            :mc-versions:1.21.x:1.21.7:neoforge:build \
            :mc-versions:1.21.x:1.21.7:quilt:build \
            :mc-versions:1.21.x:1.21.8:common:build \
            :mc-versions:1.21.x:1.21.8:fabric:build \
            :mc-versions:1.21.x:1.21.8:neoforge:build \
            :mc-versions:1.21.x:1.21.8:quilt:build \
            :mc-versions:1.21.x:1.21.9:common:build \
            :mc-versions:1.21.x:1.21.9:fabric:build \
            :mc-versions:1.21.x:1.21.9:neoforge:build \
            :mc-versions:1.21.x:1.21.9:quilt:build \
            :mc-versions:1.21.x:1.21.10:common:build \
            :mc-versions:1.21.x:1.21.10:fabric:build \
            :mc-versions:1.21.x:1.21.10:neoforge:build \
            :mc-versions:1.21.x:1.21.10:quilt:build \
            -Dorg.gradle.java.home="$JAVA_HOME"
      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-21
          if-no-files-found: error
          path: |
            fabric/build/libs/pride_land-*.jar
            forge/build/libs/pride_land-*.jar
            quilt/build/libs/pride_land-*.jar
            mc-versions/**/build/libs/pride_land-*.jar

  build-26x:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: make gradle wrappers executable
        run: chmod +x mc-versions/1.26.x/gradlew mc-versions/1.26.x-fabric/gradlew
      - name: build 26.2 NeoForge
        shell: bash
        working-directory: mc-versions/1.26.x
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"
      - name: build 26.2 Fabric
        shell: bash
        working-directory: mc-versions/1.26.x-fabric
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"
      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-26x
          if-no-files-found: error
          path: |
            mc-versions/1.26.x/build/libs/pride_land-*.jar
            mc-versions/1.26.x-fabric/build/libs/pride_land-*.jar

  publish:
    needs: [build, build-26x]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.20.1 (root modules)
          - { version: "1.20.1", loader: fabric,   prefix: jars-21, java: "21", jar: fabric/build/libs/pride_land-1.0.4-1.20.1.jar }
          - { version: "1.20.1", loader: forge,    prefix: jars-21, java: "21", jar: forge/build/libs/pride_land-1.0.4-1.20.1.jar }
          - { version: "1.20.1", loader: quilt,    prefix: jars-21, java: "21", jar: quilt/build/libs/pride_land-1.0.4-1.20.1.jar }
          # 1.20.2
          - { version: "1.20.2", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.2/fabric/build/libs/pride_land-1.0.4-1.20.2.jar }
          - { version: "1.20.2", loader: forge,    prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.2/forge/build/libs/pride_land-1.0.4-1.20.2.jar }
          # 1.20.3 (Forge line abandoned upstream)
          - { version: "1.20.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.3/fabric/build/libs/pride_land-1.0.4-1.20.3.jar }
          # 1.20.4
          - { version: "1.20.4", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.4/fabric/build/libs/pride_land-1.0.4-1.20.4.jar }
          - { version: "1.20.4", loader: forge,    prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.4/forge/build/libs/pride_land-1.0.4-1.20.4.jar }
          - { version: "1.20.4", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.20.x/1.20.4/quilt/build/libs/pride_land-1.0.4-1.20.4.jar }
          # 1.21.1
          - { version: "1.21.1", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.1/fabric/build/libs/pride_land-1.0.4-1.21.1.jar }
          - { version: "1.21.1", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.1/neoforge/build/libs/pride_land-1.0.4-1.21.1.jar }
          - { version: "1.21.1", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.1/quilt/build/libs/pride_land-1.0.4-1.21.1.jar }
          # 1.21.2 - 1.21.10
          - { version: "1.21.2", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.2/fabric/build/libs/pride_land-1.0.4-1.21.2.jar }
          - { version: "1.21.2", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.2/neoforge/build/libs/pride_land-1.0.4-1.21.2.jar }
          - { version: "1.21.2", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.2/quilt/build/libs/pride_land-1.0.4-1.21.2.jar }
          - { version: "1.21.3", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.3/fabric/build/libs/pride_land-1.0.4-1.21.3.jar }
          - { version: "1.21.3", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.3/neoforge/build/libs/pride_land-1.0.4-1.21.3.jar }
          - { version: "1.21.3", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.3/quilt/build/libs/pride_land-1.0.4-1.21.3.jar }
          - { version: "1.21.4", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.4/fabric/build/libs/pride_land-1.0.4-1.21.4.jar }
          - { version: "1.21.4", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.4/neoforge/build/libs/pride_land-1.0.4-1.21.4.jar }
          - { version: "1.21.4", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.4/quilt/build/libs/pride_land-1.0.4-1.21.4.jar }
          - { version: "1.21.5", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.5/fabric/build/libs/pride_land-1.0.4-1.21.5.jar }
          - { version: "1.21.5", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.5/neoforge/build/libs/pride_land-1.0.4-1.21.5.jar }
          - { version: "1.21.5", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.5/quilt/build/libs/pride_land-1.0.4-1.21.5.jar }
          - { version: "1.21.6", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.6/fabric/build/libs/pride_land-1.0.4-1.21.6.jar }
          - { version: "1.21.6", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.6/neoforge/build/libs/pride_land-1.0.4-1.21.6.jar }
          - { version: "1.21.6", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.6/quilt/build/libs/pride_land-1.0.4-1.21.6.jar }
          - { version: "1.21.7", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.7/fabric/build/libs/pride_land-1.0.4-1.21.7.jar }
          - { version: "1.21.7", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.7/neoforge/build/libs/pride_land-1.0.4-1.21.7.jar }
          - { version: "1.21.7", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.7/quilt/build/libs/pride_land-1.0.4-1.21.7.jar }
          - { version: "1.21.8", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.8/fabric/build/libs/pride_land-1.0.4-1.21.8.jar }
          - { version: "1.21.8", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.8/neoforge/build/libs/pride_land-1.0.4-1.21.8.jar }
          - { version: "1.21.8", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.8/quilt/build/libs/pride_land-1.0.4-1.21.8.jar }
          - { version: "1.21.9", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.9/fabric/build/libs/pride_land-1.0.4-1.21.9.jar }
          - { version: "1.21.9", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.9/neoforge/build/libs/pride_land-1.0.4-1.21.9.jar }
          - { version: "1.21.9", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.9/quilt/build/libs/pride_land-1.0.4-1.21.9.jar }
          - { version: "1.21.10", loader: fabric,  prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.10/fabric/build/libs/pride_land-1.0.4-1.21.10.jar }
          - { version: "1.21.10", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.10/neoforge/build/libs/pride_land-1.0.4-1.21.10.jar }
          - { version: "1.21.10", loader: quilt,   prefix: jars-21, java: "21", jar: mc-versions/1.21.x/1.21.10/quilt/build/libs/pride_land-1.0.4-1.21.10.jar }
          # 1.21.11 (NeoForge module lives in the forge/ dir)
          - { version: "1.21.11", loader: fabric,   prefix: jars-21, java: "21", jar: mc-versions/1.21.11/fabric/build/libs/pride_land-1.0.4-1.21.11.jar }
          - { version: "1.21.11", loader: neoforge, prefix: jars-21, java: "21", jar: mc-versions/1.21.11/forge/build/libs/pride_land-1.0.4-1.21.11.jar }
          - { version: "1.21.11", loader: quilt,    prefix: jars-21, java: "21", jar: mc-versions/1.21.11/quilt/build/libs/pride_land-1.0.4-1.21.11.jar }
          # 26.2 (standalone builds, Java 25)
          - { version: "26.2", loader: neoforge, prefix: jars-26x, java: "25", jar: mc-versions/1.26.x/build/libs/pride_land-1.0.4-26.2.jar }
          - { version: "26.2", loader: fabric,   prefix: jars-26x, java: "25", jar: mc-versions/1.26.x-fabric/build/libs/pride_land-1.0.4-26.2.jar }
    steps:
      - name: download jars
        uses: actions/download-artifact@v4
        with:
          pattern: 'jars-*'
          path: .
      - name: publish to Modrinth + CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ matrix.prefix }}/${{ matrix.jar }}
          version: 1.0.4-${{ matrix.version }}-${{ matrix.loader }}
          version-type: ${{ inputs.release-type || 'release' }}
          game-versions: ${{ matrix.version }}
          loaders: ${{ matrix.loader }}
          java: ${{ matrix.java }}
          changelog: "PrideLand ${{ github.ref_name || 'manual' }} for Minecraft ${{ matrix.version }} (${{ matrix.loader }})"
