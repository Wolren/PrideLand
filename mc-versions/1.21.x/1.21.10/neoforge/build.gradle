plugins {
    id "architectury-plugin"
    id "dev.architectury.loom"
    id "pride.land.mc-version"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":mc-versions:1.21.x:1.21.10:common").loom.accessWidenerPath

    neoForge {
        // NeoForge handles access wideners natively
    }
}

// Validate against Fabric's Mojmap jar; NeoForge uses SRG and convertAccessWideners handles it.
tasks.named("validateAccessWidener").configure {
    enabled = false
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

dependencies {
    minecraft "com.mojang:minecraft:${project.findProperty("minecraft_version")}"
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:${project.findProperty("yarn_mappings")}:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${project.findProperty("yarn_mappings_patch_neoforge_version")}")
    }
    neoForge "net.neoforged:neoforge:${project.findProperty("neo_version")}"
    modApi "dev.architectury:architectury-neoforge:${project.findProperty("architectury_api_version")}"

    common(project(path: ":mc-versions:1.21.x:1.21.10:common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":mc-versions:1.21.x:1.21.10:common", configuration: "transformProductionForge")) { transitive false }

    modApi "me.shedaniel.cloth:cloth-config-neoforge:${project.findProperty("cloth_config")}"

    implementation 'com.google.code.gson:gson:2.8.9'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.findProperty("minecraft_version")
    inputs.property "architectury_min_version", project.findProperty("architectury_min_version")
    inputs.property "cloth_config_min_version", project.findProperty("cloth_config_min_version")

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_version": project.findProperty("minecraft_version"),
                "architectury_min_version": project.findProperty("architectury_min_version"),
                "cloth_config_min_version": project.findProperty("cloth_config_min_version")
    }

    // Dev runs don't get the common module's assets on the classpath, so the
    // mod's own resource pack root must carry them (icon, lang, models, textures).
    from(project(":mc-versions:1.21.x:1.21.10:common").sourceSets.main.resources) {
        include "assets/**", "data/**", "pack.mcmeta"
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    dependsOn configurations.shadowCommon
    from {
        configurations.shadowCommon.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

remapJar {
    injectAccessWidener = true
    input.set jar.archiveFile
    dependsOn jar
}

sourcesJar {
    def commonSources = project(":mc-versions:1.21.x:1.21.10:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
