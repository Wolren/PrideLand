plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url "https://maven.shedaniel.me" }
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ is unobfuscated - no mappings needed
    //
    
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // quilt-loader at compile only — no runtime conflict with fabric-loader's Knot classes.
    // The dev launch runs on fabric-loader; the built jar is quilt-loadable via quilt.mod.json.
    compileOnly "org.quiltmc:quilt-loader:${project.quilt_loader_version}"

    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
}

processResources {
    inputs.property "pack_format", project.findProperty("pack_format")

    filesMatching("pack.mcmeta") {
        expand "pack_format": project.findProperty("pack_format")
    }

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "quilt_loader_version", project.quilt_loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    filesMatching("quilt.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "quilt_loader_version": project.quilt_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
