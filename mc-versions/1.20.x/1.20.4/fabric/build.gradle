plugins {
    id "architectury-plugin"
    id "dev.architectury.loom"
    id "pride.land.mc-version"
}

repositories {
    maven { url "https://maven.nucleoid.xyz/" }
    mavenLocal()
    maven { url "https://repo.sleeping.town/" }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":mc-versions:1.20.x:1.20.4:common").loom.accessWidenerPath

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "pride_land.refmap.json"
        add(sourceSets.main)
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${project.findProperty("minecraft_version")}"
    mappings "net.fabricmc:yarn:${project.findProperty("yarn_mappings")}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.findProperty("fabric_loader_version")}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.findProperty("fabric_api_version")}"
    modApi "dev.architectury:architectury-fabric:${project.findProperty("architectury_api_version")}"

    common(project(path: ":mc-versions:1.20.x:1.20.4:common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":mc-versions:1.20.x:1.20.4:common", configuration: "transformProductionFabric")) { transitive false }

    include(modImplementation("com.terraformersmc.terraform-api:terraform-wood-api-v1:${project.findProperty("terraform_api")}"))

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.findProperty("rei_version")}"
    modCompileOnly "dev.emi:emi-fabric:${project.findProperty("emi_version")}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.findProperty("emi_version")}"
    // Renders the custom.mcb badges ("Client & Server", "Gay Certified") in ModMenu
    modLocalRuntime "maven.modrinth:modmenu-badges-lib:2026.3.1"
    modImplementation "com.terraformersmc:modmenu:${project.findProperty("modmenu")}"
    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.findProperty("cloth_config")}"

    implementation 'com.google.code.gson:gson:2.14.0'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.findProperty("minecraft_version")
    inputs.property "loader_version", project.findProperty("fabric_loader_version")

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.findProperty("minecraft_version"),
                "loader_version": project.findProperty("fabric_loader_version")
    }

    // Dev runs don't get the common module's assets on the classpath, so the
    // mod's own resource pack root must carry them (icon, lang, models, textures).
    from(project(":mc-versions:1.20.x:1.20.4:common").sourceSets.main.resources) {
        include "assets/**", "data/**", "pack.mcmeta"
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    dependsOn project(":mc-versions:1.20.x:1.20.4:common").tasks.named("transformProductionFabric")
    from {
        configurations.shadowCommon.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude "architectury.common.json"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

remapJar {
    injectAccessWidener = true
    input.set jar.archiveFile
    dependsOn jar
}

sourcesJar {
    def commonSources = project(":mc-versions:1.20.x:1.20.4:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
