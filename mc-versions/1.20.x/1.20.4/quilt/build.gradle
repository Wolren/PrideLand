plugins {
    id "architectury-plugin"
    id "dev.architectury.loom"
    id "pride.land.mc-version"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":mc-versions:1.20.x:common").loom.accessWidenerPath

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "pride_land.refmap.json"
        add(sourceSets.main)
    }
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${project.findProperty("minecraft_version")}"
    mappings "net.fabricmc:yarn:${project.findProperty("yarn_mappings")}:v2"
    // quilt-loader at compile only — no runtime conflict with fabric-loader's Knot classes
    modCompileOnly "org.quiltmc:quilt-loader:${project.findProperty("quilt_loader_version")}"
    // fabric-loader at runtime for dev launch
    modImplementation "net.fabricmc:fabric-loader:${project.findProperty("fabric_loader_version")}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.findProperty("fabric_api_version")}"
    modApi "dev.architectury:architectury-fabric:${project.findProperty("architectury_api_version")}"

    common(project(path: ":mc-versions:1.20.x:common", configuration: "namedElements")) { transitive false }

    include(modImplementation("com.terraformersmc.terraform-api:terraform-wood-api-v1:${project.findProperty("terraform_api")}"))
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.findProperty("minecraft_version")
    inputs.property "quilt_loader_version", project.findProperty("quilt_loader_version")
    inputs.property "qfapi_version", project.findProperty("qfapi_version")

    filesMatching("quilt.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.findProperty("minecraft_version"),
                "quilt_loader_version": project.findProperty("quilt_loader_version"),
                "qfapi_version": project.findProperty("qfapi_version")
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
