plugins {
    id "architectury-plugin"
    id "dev.architectury.loom"
    id "pride.land.mc-version"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":mc-versions:1.20.4:common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfigs("pride_land.forge.mixins.json")
    }
}

// Validate against Fabric's Mojmap jar; Forge uses SRG and convertAccessWideners handles it.
tasks.named("validateAccessWidener").configure {
    enabled = false
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${project.findProperty("minecraft_version")}"
    mappings "net.fabricmc:yarn:${project.findProperty("yarn_mappings")}:v2"
    forge "net.minecraftforge:forge:${project.findProperty("forge_version")}"
    modApi "dev.architectury:architectury-forge:${project.findProperty("architectury_api_version")}"

    common(project(path: ":mc-versions:1.20.4:common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":mc-versions:1.20.4:common", configuration: "transformProductionForge")) { transitive false }

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-forge:${project.findProperty("rei_version")}"
    modCompileOnly "dev.emi:emi-forge:${project.findProperty("emi_version")}:api"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${project.findProperty("cloth_config")}"

    implementation 'com.google.code.gson:gson:2.8.9'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.findProperty("minecraft_version")
    inputs.property "architectury_min_version", project.findProperty("architectury_min_version")
    inputs.property "cloth_config_min_version", project.findProperty("cloth_config_min_version")

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "minecraft_version": project.findProperty("minecraft_version"),
                "architectury_min_version": project.findProperty("architectury_min_version"),
                "cloth_config_min_version": project.findProperty("cloth_config_min_version")
    }
}

jar {
    dependsOn configurations.shadowCommon
    from {
        configurations.shadowCommon.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

remapJar {
    injectAccessWidener = true
    input.set jar.archiveFile
    dependsOn jar
}

sourcesJar {
    def commonSources = project(":mc-versions:1.20.4:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
