pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
    plugins {
        // Centralized plugin versions — subprojects omit the version
        id "architectury-plugin" version "3.5.169"
        id "dev.architectury.loom" version "1.17.487"
    }
}

include("common")
include("fabric")
include("forge")
include("quilt")

// Multi-version support: each version under mc-versions/ is a full Architectury
