pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
    plugins {
        // Centralized plugin versions: subprojects omit the version.
        id "architectury-plugin" version "3.5.169"
        id "dev.architectury.loom" version "1.17.491"
    }
}

include("common")
include("fabric")
include("forge")
include("quilt")

// Multi-version subprojects: uncomment a line to activate that version (see docs/mc-versions.md).

include("mc-versions:1.20.x:1.20.2:common")
