architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfigs("pride_land.forge.mixins.json")
    }
}

// Validate against Fabric's Mojmap jar; Forge uses SRG and convertAccessWideners handles it.
tasks.named("validateAccessWidener").configure {
    enabled = false
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    mappings "net.fabricmc:yarn:${rootProject.findProperty("yarn_mappings")}:v2"
    forge "net.minecraftforge:forge:${rootProject.findProperty("forge_version")}"
    modApi "dev.architectury:architectury-forge:${rootProject.findProperty("architectury_api_version")}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-forge:${rootProject.findProperty("rei_version")}"
    modCompileOnly "dev.emi:emi-forge:${rootProject.findProperty("emi_version")}:api"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.findProperty("cloth_config")}"

    implementation 'com.google.code.gson:gson:2.14.0'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.findProperty("minecraft_version")

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "minecraft_version": rootProject.findProperty("minecraft_version")
    }

    // Dev runs don't get the common module's assets on the classpath, so the
    // mod's own resource pack root must carry them (logoFile, lang, models, textures).
    from(project(":common").sourceSets.main.resources) {
        include "assets/**", "data/**", "pack.mcmeta"
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    dependsOn configurations.shadowCommon
    from {
        configurations.shadowCommon.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

remapJar {
    injectAccessWidener = true
    input.set jar.archiveFile
    dependsOn jar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
